[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
publish = false
authors = ["Leo Borai <estebanborai@gmail.com>"]
repository = "https://github.com/LeoBorai/voir"

[workspace.dependencies]
voir-types = { path = "crates/voir-types" }
voir-sql = { path = "crates/voir-sql" }
voir-catalog = { path = "crates/voir-catalog" }
voir-plan = { path = "crates/voir-plan" }
voir-exec = { path = "crates/voir-exec" }
voir-source-csv = { path = "crates/voir-source-csv" }
voir-source-json = { path = "crates/voir-source-json" }

thiserror = "2.0.19"
nom = "8"
csv = "1.4.0"
clap = { version = "4.6.5", features = ["derive"] }
comfy-table = "7.2.2"
reedline = "0.49"
miette = { version = "7", features = ["fancy"] }
serde_json = { version = "1", features = ["preserve_order"] }
nu-ansi-term = "0.50"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documentation/naming noise, not correctness: writing `# Errors`/`# Panics`
# sections on every fallible fn is boilerplate, module_name_repetitions
# flags idiomatic names (Binder in binder.rs, Lexer in lexer.rs, ...), and
# use_self hurts readability in large enum matches far from the impl header.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
use_self = "allow"
