[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "MIT OR Apache-2.0"
rust-version = "1.85"
authors      = ["Leo Borai <estebanborai@gmail.com>"]
repository   = "https://github.com/LeoBorai/voir"

[workspace.dependencies]
voir-types       = { path = "crates/voir-types" }
voir-sql         = { path = "crates/voir-sql" }
voir-catalog     = { path = "crates/voir-catalog" }
voir-plan        = { path = "crates/voir-plan" }
voir-exec        = { path = "crates/voir-exec" }
voir-source-csv  = { path = "crates/voir-source-csv" }

thiserror   = "2"
csv         = "1"
clap        = { version = "4", features = ["derive"] }
comfy-table = "7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
